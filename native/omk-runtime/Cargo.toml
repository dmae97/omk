[package]
name = "omk-native-wire"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false

[[bin]]
name = "omk-native-wire"
path = "src/main.rs"

[workspace]
resolver = "3"

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
