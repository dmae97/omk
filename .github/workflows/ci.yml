name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed history and working tree
        # gitleaks/gitleaks-action v2
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-check-test:
    runs-on: ubuntu-latest
    env:
      COREPACK_HOME: /tmp/omk-corepack
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: |
          corepack enable npm
          corepack prepare npm@11.14.1 --activate
          npm --version

      - name: Setup Go
        # actions/setup-go v6.5.0
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.22.x"
          cache-dependency-path: packages/initcheck/go.sum

      - name: Verify native init checker
        run: |
          cd packages/initcheck
          go vet ./...
          go test -race -shuffle=on -count=1 ./...
          make verify-ghidra

      - name: Install system dependencies
        run: |
          # Hosted runners occasionally ship broken Microsoft apt mirrors.
          sudo rm -f \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/azure-cli.list \
            2>/dev/null || true
          sudo apt-get update -o Acquire::AllowReleaseInfoChange=true
          sudo apt-get install -y \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev \
            librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Verify the check did not modify the tree
        # `npm run check` must verify, never rewrite. A gate that formats the tree
        # cannot fail on the dirt it just removed, so any diff here is a defect:
        # run `npm run format` and commit the result.
        run: git diff --exit-code

      - name: Verify release consistency receipt
        id: verify_receipt
        run: node packages/coding-agent/dist/verify-ci.js

      - name: Upload release consistency receipt
        if: always() && steps.verify_receipt.outcome != 'skipped'
        # actions/upload-artifact v6.0.0
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-release-consistency
          path: .omk/ci-evidence
          if-no-files-found: error

      - name: Test
        run: npm test
