name: Build Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., v0.12.0)"
        required: true
        type: string
      source_ref:
        description: >-
          Source ref to build/publish. Defaults to the tag; use only for
          release recovery.
        required: false
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COREPACK_HOME: /tmp/omk-corepack
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: >-
        ${{ github.event.inputs.source_ref || github.event.inputs.tag ||
        github.ref_name }}
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source matches release tag
        run: |
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "RELEASE_TAG must name an existing git tag (${RELEASE_TAG})." >&2
            exit 1
          fi
          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "${SOURCE_SHA}" != "${TAG_SHA}" ]; then
            echo "SOURCE_REF must resolve to RELEASE_TAG (${RELEASE_TAG})." >&2
            exit 1
          fi

      - name: Setup Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
          no-cache: true

      - name: Setup Node.js
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin npm
        run: |
          corepack enable npm
          corepack prepare npm@11.14.1 --activate
          npm --version

      - name: Build binaries
        run: ./scripts/build-binaries.sh

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${RELEASE_TAG}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix

          # Extract changelog section for this version
          cd packages/coding-agent
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" \
            CHANGELOG.md > /tmp/release-notes.md

          # If empty, use a default message
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${VERSION}" > /tmp/release-notes.md
          fi

      - name: Stage release bundle
        run: cp /tmp/release-notes.md packages/coding-agent/binaries/release-notes.md

      - name: Upload release bundle
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-binaries-${{ env.RELEASE_TAG }}
          path: packages/coding-agent/binaries/
          if-no-files-found: error
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download release bundle
        # actions/download-artifact v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-binaries-${{ env.RELEASE_TAG }}
          path: /tmp/omk-release

      - name: Create GitHub Release and upload binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists;" \
              "skipping binary upload."
            exit 0
          fi

          cd /tmp/omk-release
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md \
            omk-darwin-arm64.tar.gz \
            omk-darwin-x64.tar.gz \
            omk-linux-x64.tar.gz \
            omk-linux-arm64.tar.gz \
            omk-windows-x64.zip \
            omk-windows-arm64.zip

  publish-npm:
    # The runtime tests require unprivileged user/network namespaces.
    runs-on: ubuntu-22.04
    needs: build
    environment: npm-publish
    permissions:
      contents: read
      # No id-token: with it set, npm attempts an OIDC trusted-publisher
      # exchange first and a failed exchange clobbers NODE_AUTH_TOKEN auth
      # (npm/cli#8730), surfacing as E404 on publish. Until trusted publishing
      # is registered for all seven packages, authenticate with the token only.
      # This also turns provenance off, matching 0.98.0, which shipped without
      # an attestation.
    env:
      COREPACK_HOME: /tmp/omk-corepack
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: >-
        ${{ github.event.inputs.source_ref || github.event.inputs.tag ||
        github.ref_name }}
    steps:
      - name: Checkout
        # actions/checkout v5.1.0
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source matches release tag
        run: |
          if ! git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            echo "RELEASE_TAG must name an existing git tag (${RELEASE_TAG})." >&2
            exit 1
          fi
          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "${SOURCE_SHA}" != "${TAG_SHA}" ]; then
            echo "SOURCE_REF must resolve to RELEASE_TAG (${RELEASE_TAG})." >&2
            exit 1
          fi

      - name: Setup Node.js
        # actions/setup-node v5.0.0
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Pin npm
        run: |
          corepack enable npm
          corepack prepare npm@11.14.1 --activate
          npm --version

      - name: Install system dependencies
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/azure-cli.list \
            2>/dev/null || true
          sudo apt-get update -o Acquire::AllowReleaseInfoChange=true
          sudo apt-get install -y \
            libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev \
            librsvg2-dev fd-find ripgrep bubblewrap
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Verify sandbox backend
        run: |
          /usr/bin/bwrap --version
          /usr/bin/bwrap --unshare-all --die-with-parent --new-session \
            --cap-drop ALL --clearenv --ro-bind / / \
            --proc /proc --dev /dev -- /bin/true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Verify release artifacts are committed
        run: |
          # This generated catalog can drift as upstream model data changes.
          # Surface drift, but require every other release artifact to match.
          git diff --stat -- packages/ai/src/models.generated.ts
          git diff --exit-code -- . \
            ':(exclude)packages/ai/src/models.generated.ts'

      - name: Publish npm packages
        env:
          # Must be a granular access token with "bypass 2FA" enabled: the
          # registry rejects every other token shape with "Two-factor
          # authentication or granular access token with bypass 2fa enabled is
          # required to publish packages."
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish.mjs
