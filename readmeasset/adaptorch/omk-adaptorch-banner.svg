  <text x="290" y="132" font-family="Georgia,'Times New Roman',serif" font-size="40" fill="#141414">OMK writes and runs code.</text>
  <text x="290" y="182" font-family="Georgia,'Times New Roman',serif" font-size="40" font-weight="bold" fill="#141414">AdaptOrch <tspan fill="#B8261F">checks</tspan> what it wrote.</text>

  <line x1="290" y1="202" x2="640" y2="202" stroke="#B8261F" stroke-width="2"/>
  <text x="290" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="1.6" fill="#141414" opacity="0.7">correctness_claim: false — it ran, and this is what happened.</text>
