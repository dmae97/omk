  <rect x="24" y="24" width="1152" height="212" fill="none" stroke="#141414" stroke-width="1.1" opacity="0.75"/>

  <text x="56" y="60" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.4" fill="#141414" opacity="0.62">FIG. 00 · OMK × ADAPTORCH</text>
  <text x="1144" y="60" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.4" fill="#141414" opacity="0.62">LOCAL AGENT · EVIDENCE LAYER</text>

  <g transform="translate(80,112) scale(2.15)">
    <circle cx="20" cy="20" r="17" fill="none" stroke="#141414" stroke-width="0.9" opacity="0.45"/>
    <circle cx="20" cy="20" r="12.5" fill="none" stroke="#141414" stroke-width="0.6" stroke-dasharray="1.3,2.4" opacity="0.55"/>
    <g fill="#141414">
