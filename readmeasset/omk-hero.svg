  <rect x="24" y="24" width="1152" height="372" fill="none" stroke="#141414" stroke-width="1.1" opacity="0.75"/>

  <text x="56" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.4" fill="#141414" opacity="0.62">FIG. 01 · THE CONTROL LOOP</text>
  <text x="1144" y="62" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2.4" fill="#141414" opacity="0.62">MIT · PROVIDER-NEUTRAL</text>

  <g transform="translate(80,140) scale(3.5)">
    <path d="M 25.81 4.02 A 17 17 0 1 1 14.19 4.02" fill="none" stroke="#141414" stroke-width="0.9" opacity="0.45"/>
    <path d="M 16.26 3.27 L 14.57 5.05 L 13.81 2.99 Z" fill="#141414" opacity="0.45"/>
    <circle cx="20" cy="20" r="12.5" fill="none" stroke="#141414" stroke-width="0.6" stroke-dasharray="1.3,2.4" opacity="0.55"/>
    <g stroke="#141414" stroke-width="0.7" stroke-linecap="round" opacity="0.85">
      <line x1="20" y1="16.6" x2="20" y2="9.2"/>
      <line x1="23.4" y1="20" x2="30.8" y2="20"/>
      <line x1="16.6" y1="20" x2="9.2" y2="20"/>
    </g>
    <g fill="#141414">
      <circle cx="20" cy="7.5" r="1.7"/><circle cx="32.5" cy="20" r="1.7"/><circle cx="7.5" cy="20" r="1.7"/>
    </g>
    <line x1="20" y1="23.4" x2="20" y2="30.8" stroke="#B8261F" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="20" cy="32.5" r="1.7" fill="#B8261F"/>
    <circle cx="20" cy="20" r="3.4" fill="#141414"/>
  </g>

  <text x="360" y="168" font-family="Georgia,'Times New Roman',serif" font-size="86" font-weight="bold" letter-spacing="2" fill="#141414">OMK</text>
  <text x="362" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" letter-spacing="4.2" fill="#141414" opacity="0.72">OPEN MULTI-AGENT KIT</text>

  <line x1="362" y1="232" x2="700" y2="232" stroke="#B8261F" stroke-width="2"/>

  <text x="362" y="272" font-family="Georgia,'Times New Roman',serif" font-size="32" fill="#141414">Make “done” <tspan fill="#B8261F">pass a check.</tspan></text>
  <text x="362" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#141414">/goal verify node --test check.test.mjs</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="1.8" fill="#141414" opacity="0.66">
    <text x="362" y="352">SCOPE</text>
    <text x="452" y="352">→ ROUTE</text>
    <text x="562" y="352">→ VERIFY</text>
    <text x="678" y="352">→ REPLAY</text>
