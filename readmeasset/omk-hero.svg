<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="OMK — Open Multi-Agent Kit. Make done pass a check.">
  <title>OMK — Open Multi-Agent Kit</title>
  <rect width="1200" height="420" fill="#EDE6D6"/>

  <g stroke="#C9C2B4" stroke-width="0.8" opacity="0.5">
    <line x1="40" y1="0" x2="40" y2="420"/><line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/><line x1="280" y1="0" x2="280" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/><line x1="440" y1="0" x2="440" y2="420"/>
    <line x1="520" y1="0" x2="520" y2="420"/><line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="680" y1="0" x2="680" y2="420"/><line x1="760" y1="0" x2="760" y2="420"/>
    <line x1="840" y1="0" x2="840" y2="420"/><line x1="920" y1="0" x2="920" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/><line x1="1080" y1="0" x2="1080" y2="420"/>
    <line x1="1160" y1="0" x2="1160" y2="420"/>
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="120" x2="1200" y2="120"/>
